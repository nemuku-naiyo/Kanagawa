<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神奈川エリア踏破表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif JP', 'Yu Mincho', serif;
    background: #f3ede0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(180, 140, 90, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(120, 80, 50, 0.04) 0%, transparent 50%);
    color: #2a1f15;
    padding: 20px 16px 40px;
    line-height: 1.5;
    min-height: 100vh;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 20px;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: #8b6f47;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }

  .progress-panel {
    background: #fffdf5;
    border: 1px solid #8b6f47;
    padding: 14px 16px;
    margin-bottom: 16px;
    position: sticky;
    top: 8px;
    z-index: 20;
    box-shadow: 0 4px 12px rgba(60, 40, 20, 0.08);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-label {
    font-size: 13px;
    font-weight: 600;
  }

  .progress-count {
    font-size: 11px;
    color: #6b5840;
  }

  .progress-bar {
    height: 8px;
    background: #e0d2b3;
    border: 1px solid #8b6f47;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #8b6f47 0%, #6b5840 100%);
    transition: width 0.3s ease;
    width: 0%;
  }

  .filter-row {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }

  .filter-btn {
    flex: 1;
    padding: 6px 8px;
    background: #fffdf5;
    color: #2a1f15;
    border: 1px solid #8b6f47;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  .filter-btn.active {
    background: #2a1f15;
    color: #f3ede0;
  }

  .region {
    background: #fffdf5;
    border: 1px solid #8b6f47;
    margin-bottom: 14px;
  }

  .region-header {
    width: 100%;
    background: #ebe0c9;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    border: none;
    font-family: inherit;
    color: #2a1f15;
    text-align: left;
  }

  .region-header.expanded {
    border-bottom: 1px solid #8b6f47;
  }

  .region-title-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .region-arrow {
    font-size: 11px;
    color: #8b6f47;
  }

  .region-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .region-progress {
    font-size: 11px;
    color: #6b5840;
  }

  .region-body {
    display: block;
  }

  .region-body.collapsed {
    display: none;
  }

  .section {
    padding: 10px 14px 14px;
  }

  .section + .section {
    border-top: 1px dashed #d4c4a0;
  }

  .section-title {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: #8b6f47;
    margin-bottom: 8px;
  }

  .spot-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 4px;
    cursor: pointer;
    border-bottom: 1px dotted #e8dcc1;
    font-size: 14px;
  }

  .spot-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #6b5840;
    cursor: pointer;
    flex-shrink: 0;
  }

  .spot-label {
    flex: 1;
  }

  .spot-item.checked .spot-label {
    color: #a89878;
    text-decoration: line-through;
  }

  .hidden {
    display: none !important;
  }

  .actions {
    margin-top: 20px;
    text-align: center;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .action-btn {
    padding: 8px 20px;
    background: transparent;
    border: 1px solid #8b6f47;
    color: #8b6f47;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.2em;
    cursor: pointer;
  }

  .action-btn:hover {
    background: #8b6f47;
    color: #fffdf5;
  }

  footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid #8b6f47;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #8b6f47;
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="eyebrow">KANAGAWA FIELD STUDY · CHECKLIST</div>
    <h1>神奈川エリア踏破表</h1>
  </header>

  <div class="progress-panel">
    <div class="progress-row">
      <div class="progress-label">踏破率 <span id="percentage">0</span>%</div>
      <div class="progress-count"><span id="checked-count">0</span> / <span id="total-count">0</span> スポット</div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">全て</button>
      <button class="filter-btn" data-filter="unchecked">未訪のみ</button>
      <button class="filter-btn" data-filter="checked">訪問済のみ</button>
    </div>
  </div>

  <div id="regions"></div>

  <div class="actions">
    <button class="action-btn" id="export-btn">エクスポート</button>
    <button class="action-btn" id="import-btn">インポート</button>
    <button class="action-btn" id="reset-btn">全てリセット</button>
  </div>

  <footer>
    チェック状態は自動保存されます · v1.0
  </footer>
</div>

<script>
const AREAS = [

      },
      {

        spots: ['新横浜', '日吉', '綱島', '都筑(センター北・南)', '港北ニュータウン', 'たまプラーザ', '青葉台', 'あざみ野', '中山・十日市場(緑区)']
      },
      {
        name: '西部・南部',
        spots: ['保土ヶ谷', '二俣川', '三ツ境(瀬谷)', '湘南台北側・いずみ野(泉区)', '戸塚', '東戸塚', '本郷台・大船東側(栄区)', '上大岡', '港南台', '磯子', '根岸', '洋光台', '金沢八景', '金沢文庫', '八景島', '海の公園', '野島']
      }
    ]
  },
  {
    region: '川崎市',
    sections: [
      {
        name: '臨海・南部',
        spots: ['川崎駅', '京浜工業地帯', '東扇島', '川崎大師', '浮島', '幸区(新川崎・夢見ヶ崎)', '武蔵小杉', '新丸子', '元住吉']
      },
      {
        name: '内陸・北部',
        spots: ['溝の口', '二子新地', '鷺沼', '宮前平', '登戸', '生田', '向ヶ丘遊園', '藤子・F・不二雄ミュージアム', '新百合ヶ丘', '柿生']
      }
    ]
  },
  {
    region: '相模原市',
    sections: [
      {
        name: '中央・南',
        spots: ['相模原駅', '淵野辺', '相模原公園', '小田急相模原', '相武台', '古淵']
      },
      {
        name: '緑区(津久井方面)',
        spots: ['橋本', '城山', '津久井', '相模湖', '藤野', '宮ヶ瀬北側']
      }
    ]
  },
  {
    region: '横須賀三浦',
    sections: [
      {
        name: '横須賀市',
        spots: ['横須賀中央', '汐入', 'どぶ板通り', '三笠公園', 'ヴェルニー公園', '観音崎', '走水', '馬堀', '浦賀', '久里浜', '佐島', '長井', '武山', '猿島']
      },
      {
        name: '鎌倉市',
        spots: ['鎌倉駅周辺', '由比ヶ浜', '長谷', '極楽寺', '稲村ヶ崎', '七里ヶ浜', '北鎌倉', '大船', '腰越', '鎌倉山']
      },
      {
        name: '逗子・葉山・三浦',
        spots: ['逗子駅', '披露山', '小坪', '葉山(一色海岸)', '葉山(御用邸)', '森戸', '長者ヶ崎', '三崎', '城ヶ島', '油壷', '三浦海岸', '剱崎', '毘沙門']
      }
    ]
  },
  {
    region: '湘南',
    sections: [
      {
        name: '藤沢市',
        spots: ['藤沢駅', '辻堂', '湘南台', '江ノ島', '片瀬', '鵠沼', '長後', '六会', '遠藤(SFC周辺)', '湘南ライフタウン', '北部・用田']
      },
      {
        name: '茅ヶ崎・平塚・寒川',
        spots: ['茅ヶ崎駅', 'サザンビーチ', '香川(茅ヶ崎北部)', '平塚駅', '八幡', '湘南平', '平塚北部・土屋吉沢', '寒川神社', '宮山']
      }
    ]
  },
  {
    region: '県央',
    sections: [
      {
        name: '厚木・伊勢原・清川愛川',
        spots: ['本厚木駅', '愛甲石田', '七沢温泉', '飯山温泉', '煤ヶ谷方面', '伊勢原駅', '大山', '日向薬師', '比々多', '愛川・半原', '愛川・中津', '宮ヶ瀬ダム下流', '清川村・宮ヶ瀬湖畔']
      },
      {
        name: '海老名・座間・綾瀬・大和',
        spots: ['海老名駅', 'ららぽーと海老名', '社家', '国分', '座間', '相武台前', 'キャンプ座間', '綾瀬・厚木基地', '大和駅', '中央林間', '桜ヶ丘', '南林間', '深見']
      },
      {
        name: '秦野',
        spots: ['秦野駅', '渋沢', '弘法山', '鶴巻温泉', '名水百選・弘法の清水']
      }
    ]
  },
  {
    region: '県西',
    sections: [
      {
        name: '小田原・南足柄',
        spots: ['小田原駅', '板橋・清閑亭・松永記念館', '早川', '根府川', '橘', '酒匂', '栢山', '国府津', '大雄山', '足柄峠', '夕日の滝', '矢倉沢']
      },
      {
        name: '足柄上郡(中井・大井・松田・山北・開成)',
        spots: ['中井', '相模金子・上大井', '松田', '寄(やどりき)', '山北駅', '丹沢湖', '三保ダム', '世附', '開成あじさいの里']
      },
      {
        name: '中郡(二宮・大磯)',
        spots: ['二宮駅', '吾妻山', '大磯駅', '旧吉田茂邸', 'こゆるぎの浜', '大磯・国府']
      }
    ]
  },
  {
    region: '箱根・西湘温泉',
    sections: [
      {
        name: '箱根町',
        spots: ['箱根湯本', '塔ノ沢', '宮ノ下', '小涌谷', '強羅', '大涌谷', '芦ノ湖', '仙石原', '湖尻', '元箱根']
      },
      {
        name: '真鶴・湯河原',
        spots: ['真鶴駅', '真鶴半島・三ツ石', '貴船神社', '湯河原駅', '湯河原温泉街', '奥湯河原', '城願寺']
      }
    ]
  }
];

const STORAGE_KEY = 'kanagawa_checklist_v1';
const COLLAPSE_KEY = 'kanagawa_checklist_collapsed_v1';

let checked = {};
let collapsed = {};
let currentFilter = 'all';

// Load from localStorage
function load() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) checked = JSON.parse(saved);
  } catch (e) {
    console.error('Load failed:', e);
  }
  try {
    const savedCollapsed = localStorage.getItem(COLLAPSE_KEY);
    if (savedCollapsed) collapsed = JSON.parse(savedCollapsed);
  } catch (e) {}
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
  } catch (e) {
    console.error('Save failed:', e);
  }
}

function saveCollapsed() {
  try {
    localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed));
  } catch (e) {}
}

function getAllSpots() {
  return AREAS.flatMap(r => r.sections.flatMap(s => s.spots));
}

function updateProgress() {
  const all = getAllSpots();
  const total = all.length;
  const count = all.filter(s => checked[s]).length;
  const pct = total > 0 ? Math.round((count / total) * 100) : 0;

  document.getElementById('percentage').textContent = pct;
  document.getElementById('checked-count').textContent = count;
  document.getElementById('total-count').textContent = total;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function shouldShowSpot(spot) {
  if (currentFilter === 'unchecked') return !checked[spot];
  if (currentFilter === 'checked') return !!checked[spot];
  return true;
}

function render() {
  const regionsDiv = document.getElementById('regions');
  regionsDiv.innerHTML = '';

  AREAS.forEach(region => {
    const regionSpots = region.sections.flatMap(s => s.spots);
    const regionCheckedCount = regionSpots.filter(s => checked[s]).length;
    const regionPct = Math.round((regionCheckedCount / regionSpots.length) * 100);
    const isCollapsed = !!collapsed[region.region];

    // Filter check
    const hasVisibleSpots = regionSpots.some(shouldShowSpot);
    if (!hasVisibleSpots && currentFilter !== 'all') return;

    const regionEl = document.createElement('div');
    regionEl.className = 'region';

    const headerBtn = document.createElement('button');
    headerBtn.className = 'region-header' + (isCollapsed ? '' : ' expanded');
    headerBtn.innerHTML = `
      <div class="region-title-group">
        <span class="region-arrow">${isCollapsed ? '▶' : '▼'}</span>
        <span class="region-title">${region.region}</span>
      </div>
      <span class="region-progress">${regionCheckedCount}/${regionSpots.length} (${regionPct}%)</span>
    `;
    headerBtn.addEventListener('click', () => {
      collapsed[region.region] = !collapsed[region.region];
      saveCollapsed();
      render();
    });
    regionEl.appendChild(headerBtn);

    const bodyEl = document.createElement('div');
    bodyEl.className = 'region-body' + (isCollapsed ? ' collapsed' : '');

    region.sections.forEach(section => {
      const visibleSpots = section.spots.filter(shouldShowSpot);
      if (visibleSpots.length === 0 && currentFilter !== 'all') return;

      const sectionEl = document.createElement('div');
      sectionEl.className = 'section';

      const titleEl = document.createElement('div');
      titleEl.className = 'section-title';
      titleEl.textContent = section.name;
      sectionEl.appendChild(titleEl);

      section.spots.forEach(spot => {
        const isChecked = !!checked[spot];
        const showItem = shouldShowSpot(spot);

        const label = document.createElement('label');
        label.className = 'spot-item' + (isChecked ? ' checked' : '') + (showItem ? '' : ' hidden');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = isChecked;
        cb.addEventListener('change', () => {
          checked[spot] = cb.checked;
          if (!cb.checked) delete checked[spot];
          save();
          updateProgress();
          // Re-render in case filter hides this item now
          if (currentFilter !== 'all') render();
          else {
            label.classList.toggle('checked', cb.checked);
            updateRegionHeader(region.region);
          }
        });

        const span = document.createElement('span');
        span.className = 'spot-label';
        span.textContent = spot;

        label.appendChild(cb);
        label.appendChild(span);
        sectionEl.appendChild(label);
      });

      bodyEl.appendChild(sectionEl);
    });

    regionEl.appendChild(bodyEl);
    regionsDiv.appendChild(regionEl);
  });
}

function updateRegionHeader(regionName) {
  // Lightweight update of region header progress (without full re-render)
  const region = AREAS.find(r => r.region === regionName);
  if (!region) return;
  const regionSpots = region.sections.flatMap(s => s.spots);
  const count = regionSpots.filter(s => checked[s]).length;
  const pct = Math.round((count / regionSpots.length) * 100);
  // Find by text content (simple approach since we re-render often anyway)
  document.querySelectorAll('.region-header').forEach(h => {
    if (h.querySelector('.region-title').textContent === regionName) {
      h.querySelector('.region-progress').textContent = `${count}/${regionSpots.length} (${pct}%)`;
    }
  });
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('全てのチェックを解除しますか?')) {
    checked = {};
    save();
    updateProgress();
    render();
  }
});

// Export
document.getElementById('export-btn').addEventListener('click', () => {
  const data = JSON.stringify(checked, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kanagawa_checklist_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// Import
document.getElementById('import-btn').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (confirm('現在のチェック状態を上書きしますか?')) {
          checked = imported;
          save();
          updateProgress();
          render();
        }
      } catch (err) {
        alert('JSONの読み込みに失敗しました');
      }
    };
    reader.readAsText(file);
  });
  input.click();
});

// Initialize
load();
updateProgress();
render();
</script>
</body>
</html>
